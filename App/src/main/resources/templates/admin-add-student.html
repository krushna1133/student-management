<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Add Student</title>
    <link rel="stylesheet" href="/css/sidebar.css" />

    <style>
      body {
        background: #f5f7fb;
        font-family:
          Segoe UI,
          Arial;
      }

      .layout {
        display: flex;
        height: 100vh;
      }

      .main {
        flex: 1;
        padding: 30px;
      }

      .card {
        background: white;
        padding: 30px;
        border-radius: 16px;
        max-width: 500px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 8px;
        border: 1px solid #ddd;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #1e4fd6;
      }
    </style>
  </head>

  <body>
    <div class="layout">
      <!-- SIDEBAR -->
      <div th:replace="~{fragments/admin-sidebar :: sidebar('students')}"></div>

      <!-- MAIN -->
      <main class="main">
        <h2>Add Student</h2>

        <div class="card">
          <form action="/students/add" method="post">
            <input
              type="text"
              name="name"
              placeholder="Student Name"
              required
            />

            <input type="email" name="email" placeholder="Email" required />

            <input type="text" name="course" placeholder="Course" required />

            <input
              type="text"
              name="username"
              placeholder="Username"
              required
            />

            <input
              type="password"
              name="password"
              placeholder="Password"
              required
            />

            <button type="submit">Add Student</button>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>

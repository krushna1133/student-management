<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Add Student</title>

    <!-- Common + Admin CSS -->
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/admin/sidebar.css" />
    <link rel="stylesheet" href="/css/admin/form.css" />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="layout">
      <!-- Sidebar -->
      <!-- <div th:replace="~{fragments/admin-sidebar :: sidebar('students')}"></div> -->
      <div
        th:replace="~{fragments/admin-sidebar :: sidebar(${activePage})}"
      ></div>

      <!-- Main -->
      <main class="main">
        <div class="page-header">
          <h2><i class="fa-solid fa-user-plus"></i> Add Student</h2>
        </div>

        <div class="form-wrapper">
          <div class="card">
            <form action="/students/add" method="post">
              <div class="form-group">
                <label>Student Name</label>
                <input type="text" name="name" required />
              </div>

              <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required />
              </div>

              <div class="form-group">
                <label>Select Course</label>
                <select name="course" required>
                  <option value="">Choose course</option>
                  <option
                    th:each="c : ${courses}"
                    th:value="${c.course_name}"
                    th:text="${c.course_name}"
                  ></option>
                </select>
              </div>

              <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required />
              </div>

              <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required />
              </div>

              <button class="submit-btn" type="submit">
                <i class="fa-solid fa-plus"></i> Add Student
              </button>
            </form>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>

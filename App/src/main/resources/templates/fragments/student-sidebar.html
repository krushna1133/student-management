<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <!-- ✅ Fragment with ONE parameter -->
    <div th:fragment="sidebar(activePage)">
      <aside class="sidebar">
        <!-- Profile -->
        <div class="profile">
          <div class="avatar">
            <i class="fa-solid fa-user"></i>
          </div>
          <h3 th:text="${name}">Student</h3>
          <p>Student Dashboard</p>
        </div>

        <!-- Menu -->
        <ul class="menu">
          <li
            th:classappend="${activePage == 'dashboard'} ? 'active'"
            onclick="location.href = '/student/dashboard'"
          >
            <i class="fa-solid fa-house"></i>
            <span>Dashboard</span>
          </li>

          <li
            th:classappend="${activePage == 'profile'} ? 'active'"
            onclick="location.href = '/student/profile'"
          >
            <i class="fa-solid fa-user-pen"></i>
            <span>Update Profile</span>
          </li>
        </ul>

        <!-- Logout -->
        <form action="/logout" method="post" class="logout-form">
          <button type="submit" class="logout-btn">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
          </button>
        </form>
      </aside>
    </div>
  </body>
</html>

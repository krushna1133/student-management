<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Courses</title>
    <link rel="stylesheet" href="/css/sidebar.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      body {
        background: #f5f7fb;
        font-family: "Segoe UI", sans-serif;
      }

      .layout {
        display: flex;
        height: 100vh;
      }

      .main {
        flex: 1;
        padding: 30px;
      }

      /* Header */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .add-btn {
        background: #2563eb;
        color: white;
        padding: 10px 18px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 14px;
        transition: 0.2s;
      }

      .add-btn:hover {
        background: #1d4ed8;
      }

      /* Table card */
      .table-card {
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        overflow: hidden;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: #f1f5f9;
        text-align: left;
        padding: 14px;
        font-size: 14px;
      }

      td {
        padding: 14px;
        border-top: 1px solid #eee;
        font-size: 14px;
      }

      tr:hover {
        background: #f9fbff;
      }

      /* Action buttons */
      .action-btn {
        border: none;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        text-decoration: none;
        margin-right: 6px;
      }

      .edit-btn {
        background: #e0edff;
        color: #2563eb;
      }

      .delete-btn {
        background: #fee2e2;
        color: #dc2626;
      }

      .edit-btn:hover {
        background: #c7dcff;
      }

      .delete-btn:hover {
        background: #fecaca;
      }
    </style>
  </head>

  <body>
    <div class="layout">
      <div
        th:replace="~{fragments/admin-sidebar :: sidebar(${activePage})}"
      ></div>

      <main class="main">
        <!-- Header -->
        <div class="header">
          <h2>Course Management</h2>

          <a href="/courses/add" class="add-btn">
            <i class="fa-solid fa-plus"></i> Add Course
          </a>
        </div>

        <!-- Table -->
        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Course Name</th>
                <th>Description</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="c : ${courses}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.name}"></td>
                <td th:text="${c.description}"></td>

                <td>
                  <a
                    th:href="@{'/courses/edit/' + ${c.id}}"
                    class="action-btn edit-btn"
                  >
                    <i class="fa-solid fa-pen"></i> Edit
                  </a>

                  <form
                    action="/courses/delete"
                    method="post"
                    style="display: inline"
                  >
                    <input type="hidden" name="id" th:value="${c.id}" />
                    <button
                      type="submit"
                      class="action-btn delete-btn"
                      onclick="return confirm('Delete course?');"
                    >
                      <i class="fa-solid fa-trash"></i> Delete
                    </button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App | Welcome</title>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #fff8e1, #ffffff);
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        max-width: 520px;
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.12);
        text-align: center;
      }

      h1 {
        font-size: 32px;
        margin-bottom: 12px;
      }

      p {
        color: #555;
        line-height: 1.6;
        margin-bottom: 28px;
      }

      button {
        height: 50px;
        width: 200px;
        border: none;
        border-radius: 16px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(135deg, #ffd95a, #ffb703);
        box-shadow: 0 10px 20px rgba(255, 183, 3, 0.35);
      }
    </style>
  </head>

  <body>
    <div class="page">
      <div class="card">
        <h1>Welcome to App 👋</h1>
        <p>
          App is a simple Student Management System where students can manage
          their academic information and admins can manage students efficiently.
        </p>

        <button onclick="window.location.href = '/login'">Login</button>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App | Welcome</title>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #fff3c4, #ffffff, #ffe8a3);
        background-size: 200% 200%;
        animation: gradientMove 8s ease infinite;
      }

      @keyframes gradientMove {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .card {
        max-width: 520px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 48px 40px;
        border-radius: 24px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
        text-align: center;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.18);
      }

      .logo {
        font-size: 42px;
        margin-bottom: 10px;
      }

      h1 {
        font-size: 34px;
        margin-bottom: 14px;
        color: #222;
      }

      p {
        color: #666;
        line-height: 1.7;
        margin-bottom: 34px;
        font-size: 15px;
      }

      .btn {
        height: 52px;
        width: 210px;
        border: none;
        border-radius: 18px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        color: #333;
        background: linear-gradient(135deg, #ffd95a, #ffb703);
        box-shadow: 0 12px 24px rgba(255, 183, 3, 0.35);
        transition: all 0.25s ease;
      }

      .btn:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 16px 30px rgba(255, 183, 3, 0.45);
      }

      .footer {
        margin-top: 24px;
        font-size: 13px;
        color: #999;
      }
    </style>
  </head>

  <body>
    <div class="page">
      <div class="card">
        <div class="logo">🎓</div>

        <h1>Welcome to App</h1>

        <p>
          A simple and smart <b>Student Management System</b> where students can
          manage their academic information and administrators can efficiently
          organize and control student data.
        </p>

        <button class="btn" onclick="window.location.href = '/login'">
          Login to Continue →
        </button>

        <div class="footer">© 2026 App • Student Management System</div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/css/sidebar.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      body {
        background: #f5f7fb;
        font-family: "Segoe UI", sans-serif;
      }

      .layout {
        display: flex;
        height: 100vh;
      }

      .main {
        flex: 1;
        padding: 30px;
      }

      /* Dashboard grid */
      .dashboard {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 20px;
        align-items: start;
      }

      /* Cards */
      .card {
        background: #ffffff;
        border-radius: 18px;
        padding: 25px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      }

      /* Total students card */
      .stats {
        font-size: 40px;
        font-weight: bold;
        color: #2563eb;
        margin-top: 10px;
      }

      /* Chart container */
      .chart-box {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 320px;
      }

      /* Make pie chart smaller */
      #chart {
        max-width: 260px !important;
        max-height: 260px !important;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <div class="layout">
      <div
        th:replace="~{fragments/admin-sidebar :: sidebar(${activePage})}"
      ></div>

      <main class="main">
        <div class="dashboard">
          <!-- Total Students -->
          <div class="card">
            <h3>Total Students</h3>
            <div class="stats" th:text="${totalStudents}">0</div>
          </div>

          <!-- Pie Chart -->
          <div class="card">
            <h3 style="margin-bottom: 15px">Students by Course</h3>

            <div class="chart-box">
              <canvas id="chart"></canvas>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script th:inline="javascript">
      /*<![CDATA[*/

      const labels = /*[[${labels}]]*/ [];
      const data = /*[[${counts}]]*/ [];

      new Chart(document.getElementById("chart"), {
        type: "pie",
        data: {
          labels: labels,
          datasets: [
            {
              data: data,
              backgroundColor: [
                "#2563eb",
                "#16a34a",
                "#f59e0b",
                "#ef4444",
                "#8b5cf6",
                "#06b6d4",
              ],
              borderWidth: 0,
            },
          ],
        },
        options: {
          plugins: {
            legend: {
              position: "bottom",
            },
          },
        },
      });

      /*]]>*/
    </script>
  </body>
</html>

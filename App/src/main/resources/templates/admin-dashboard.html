<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Admin Dashboard</title>

    <!-- Common + Admin CSS -->
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/admin/sidebar.css" />
    <link rel="stylesheet" href="/css/admin/dashboard.css" />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <div class="layout">
      <!-- Sidebar -->
      <div
        th:replace="~{fragments/admin-sidebar :: sidebar(${activePage})}"
      ></div>

      <!-- Main -->
      <main class="main">
        <div class="dashboard">
          <!-- Total Students -->
          <div class="card">
            <h3>Total Students</h3>
            <div class="stats" th:text="${totalStudents}">0</div>
          </div>

          <!-- Pie Chart -->
          <div class="card">
            <h3 style="margin-bottom: 15px">Students by Course</h3>

            <div class="chart-box">
              <canvas id="chart"></canvas>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Chart Script -->
    <script th:inline="javascript">
      const labels = /*[[${labels}]]*/ [];
      const data = /*[[${counts}]]*/ [];

      new Chart(document.getElementById("chart"), {
        type: "pie",
        data: {
          labels: labels,
          datasets: [
            {
              data: data,
              backgroundColor: [
                "#2563eb",
                "#16a34a",
                "#f59e0b",
                "#ef4444",
                "#8b5cf6",
                "#06b6d4",
              ],
              borderWidth: 0,
            },
          ],
        },
        options: {
          plugins: {
            legend: {
              position: "bottom",
            },
          },
        },
      });
    </script>
  </body>
</html>

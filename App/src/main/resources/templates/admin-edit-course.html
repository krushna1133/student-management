<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Edit Course</title>

    <link rel="stylesheet" href="/css/sidebar.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      body {
        background: #f5f7fb;
        font-family: "Segoe UI", Arial;
      }

      .layout {
        display: flex;
        height: 100vh;
      }

      .main {
        flex: 1;
        padding: 30px;
      }

      .card {
        background: white;
        padding: 30px;
        border-radius: 16px;
        max-width: 500px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      }

      input,
      textarea {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 8px;
        border: 1px solid #ddd;
      }

      textarea {
        height: 100px;
        resize: none;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #1e4fd6;
      }
    </style>
  </head>

  <body>
    <div class="layout">
      <!-- Sidebar -->
      <div th:replace="~{fragments/admin-sidebar :: sidebar('courses')}"></div>

      <!-- Main -->
      <main class="main">
        <h2>Edit Course</h2>

        <div class="card">
          <form action="/courses/update" method="post">
            <input type="hidden" name="id" th:value="${course.id}" />

            <input
              type="text"
              name="name"
              th:value="${course.course_name}"
              required
            />

            <textarea
              name="description"
              th:text="${course.description}"
              required
            ></textarea>

            <button type="submit">
              <i class="fa-solid fa-pen"></i> Update Course
            </button>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>

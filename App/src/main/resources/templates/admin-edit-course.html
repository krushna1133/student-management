<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Edit Course</title>

    <!-- Common + Admin CSS -->
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/admin/sidebar.css" />
    <link rel="stylesheet" href="/css/admin/form.css" />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="layout">
      <!-- Sidebar -->
      <div
        th:replace="~{fragments/admin-sidebar :: sidebar(${activePage})}"
      ></div>

      <!-- Main -->
      <main class="main">
        <!-- Page Header -->
        <div class="page-header">
          <h2><i class="fa-solid fa-pen"></i> Edit Course</h2>
        </div>

        <!-- Centered Form -->
        <div class="form-wrapper">
          <div class="card">
            <form action="/courses/update" method="post">
              <input type="hidden" name="id" th:value="${course.id}" />

              <div class="form-group">
                <label>Course Name</label>
                <input
                  type="text"
                  name="name"
                  th:value="${course.course_name}"
                  required
                />
              </div>

              <div class="form-group">
                <label>Course Description</label>
                <textarea
                  name="description"
                  rows="4"
                  th:text="${course.description}"
                  required
                ></textarea>
              </div>

              <button class="submit-btn" type="submit">
                <i class="fa-solid fa-pen"></i> Update Course
              </button>
            </form>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>

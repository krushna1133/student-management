<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Page Not Found</title>

    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #fff8e1, #ffffff);
      }

      .card {
        background: white;
        padding: 40px;
        border-radius: 18px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        max-width: 420px;
      }

      h1 {
        font-size: 64px;
        margin-bottom: 10px;
        color: #ffb703;
      }

      h2 {
        margin-bottom: 15px;
      }

      p {
        color: #555;
        margin-bottom: 25px;
      }

      a {
        display: inline-block;
        padding: 12px 24px;
        background: linear-gradient(135deg, #ffd95a, #ffb703);
        color: #111;
        font-weight: 700;
        border-radius: 14px;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The page you are looking for doesn’t exist.</p>
      <a href="/login">Go to Login</a>
    </div>
  </body>
</html>

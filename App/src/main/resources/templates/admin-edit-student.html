<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Edit Student</title>
    <link rel="stylesheet" href="/css/sidebar.css" />
  </head>
  <body>
    <div class="layout">
      <div th:replace="~{fragments/admin-sidebar :: sidebar('students')}"></div>

      <main class="main">
        <h2>Edit Student</h2>

        <form action="/admin/students/update" method="post">
          <input type="hidden" name="id" th:value="${student.id}" />

          <input name="name" th:value="${student.name}" required /><br /><br />
          <input
            name="email"
            th:value="${student.email}"
            required
          /><br /><br />
          <input
            name="course"
            th:value="${student.course}"
            required
          /><br /><br />

          <button type="submit">Update</button>
        </form>
      </main>
    </div>
  </body>
</html>

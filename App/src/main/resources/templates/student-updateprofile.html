<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Update Profile</title>

    <!-- Common + Student CSS -->
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/student/sidebar.css" />
    <link rel="stylesheet" href="/css/student/dashboard.css" />
    <link rel="stylesheet" href="/css/student/form.css" />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="layout">
      <!-- Sidebar -->
      <div
        th:replace="~{fragments/student-sidebar :: sidebar(${activePage})}"
      ></div>

      <!-- Main -->
      <main class="main">
        <!-- Topbar -->
        <div class="topbar">
          <h2>Update Profile</h2>
          <form action="/logout" method="post">
            <button class="logout-btn">
              <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
          </form>
        </div>

        <!-- Update Card -->
        <div class="card">
          <h3>Update Email & Password</h3>

          <!-- Success message -->
          <div class="msg" th:if="${message}" th:text="${message}"></div>

          <form action="/student/update-profile" method="post">
            <input
              type="email"
              name="email"
              th:value="${student.email}"
              placeholder="New Email"
              required
            />

            <input
              type="password"
              name="password"
              placeholder="New Password"
              required
            />

            <button type="submit">Update Profile</button>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
